# Install on a separate VM with a private IP; firewall TCP 514 so ONLY the
# app VM's private IP can connect. Check the address in the deployment guide.
module(load="imtcp")
input(type="imtcp" port="514")

# A single file on the collector contains records from BOTH backend instances.
if ($programname startswith "linklocker-") then {
    action(type="omfile" file="/var/log/linklocker-central.log")
    stop
}
