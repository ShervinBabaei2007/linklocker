# serve the site over https using the existing certificate.
server {
    listen 443 ssl;
    server_name linklocker.northcentralus.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/linklocker.northcentralus.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linklocker.northcentralus.cloudapp.azure.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # send requests to haproxy on this vm.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # pass the original ip and https scheme to the app.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# redirect http visitors to https.
server {
    listen 80;
    server_name linklocker.northcentralus.cloudapp.azure.com;
    return 301 https://$host$request_uri;
}
