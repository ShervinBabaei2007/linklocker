# log haproxy activity through the system logger.
global
    log /dev/log local0

# handle http requests and set connection time limits.
defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# nginx sends requests here; this port only listens on this vm.
frontend linklocker_front
    bind 127.0.0.1:8080
    default_backend linklocker_apps

# alternate requests between the two app workers.
backend linklocker_apps
    balance roundrobin
    # check /api/health every 3 seconds; remove a worker after two failures.
    # add it back after two successful checks.
    option httpchk GET /api/health
    http-check expect status 200
    server app1 127.0.0.1:3000 check inter 3s fall 2 rise 2
    server app2 127.0.0.1:3001 check inter 3s fall 2 rise 2

# local stats show whether both workers are up and receiving requests.
listen linklocker_stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
