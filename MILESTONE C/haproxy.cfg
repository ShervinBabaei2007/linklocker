# HAProxy runs behind the existing TLS-terminating Nginx on the same VM.
# Keep port 8080 private: only Nginx should connect to this frontend.
global
    log /dev/log local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend linklocker_front
    bind 127.0.0.1:8080
    default_backend linklocker_apps

backend linklocker_apps
    balance roundrobin
    # HAProxy removes a failed instance from the pool after two failed checks.
    option httpchk GET /api/health
    http-check expect status 200
    server app1 127.0.0.1:3000 check inter 3s fall 2 rise 2
    server app2 127.0.0.1:3001 check inter 3s fall 2 rise 2

# Local-only counters make it possible to prove requests reached both workers.
# Never expose this listener publicly; it reveals internal service details.
listen linklocker_stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
